name: Tests & Lint

on:
  push:
    branches: [main, lite]
  pull_request:
    branches: [main, lite]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Ağır AI stack'i (torch/transformers/opencv) gerekmez: tests/conftest.py
      # eksik kütüphaneleri stub'lar. Bu sayede CI saniyeler içinde tamamlanır.
      - name: Install lightweight test dependencies
        run: pip install pymupdf numpy pillow pytesseract pytest

      - name: Run test suite
        run: pytest

  lint:
    name: ruff (pyflakes + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .
