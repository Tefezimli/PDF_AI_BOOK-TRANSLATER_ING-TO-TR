[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-ai-translator"
version = "18.1.0"
description = "Offline EN->TR academic PDF translation workstation (layout-preserving, code/formula quarantine)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tefezimli" }]
keywords = ["pdf", "translation", "turkish", "offline", "academic"]

# Yalnızca hafif çalışma zamanı bağımlılıkları. Ağır AI stack'i (torch,
# transformers) BİLİNÇLİ olarak 'ai' extra'sındadır: Windows kurulum sihirbazı
# CUDA uyumlu torch'u PyPI yerine PyTorch özel indeksten kurar; sert bağımlılık
# yapılsaydı pip CPU derlemesini çekip CUDA akışını bozardı.
dependencies = [
    "pymupdf>=1.24,<3",
    "pillow>=10.0.0,<14",
    "numpy>=1.24.0,<3",
    "pytesseract>=0.3.10,<1",
    "opencv-python>=4.8.0,<6",
]

[project.optional-dependencies]
ai = [
    "torch>=2.2.0,<3",
    "transformers>=4.40.0,<5",
    "sentencepiece>=0.2.0,<1",
]
test = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
pdfai-translate = "pdf_bridge:main"

[tool.setuptools]
packages = ["core", "extractors", "translators", "renderers"]
py-modules = ["pdf_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
